# MLX LoRA Configuration for Llama-3.2-3B Fine-Tuning
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
train: true
fine_tune_type: "lora"
mask_prompt: true
num_layers: -1
batch_size: 4
iters: 3000
learning_rate: 3e-4
val_batches: 25
lora_parameters:
  rank: 64
  alpha: 128
  dropout: 0.05
  scale: 2.0
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
