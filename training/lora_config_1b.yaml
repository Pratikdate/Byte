# Byte fine-tune for the fast on-device model (Llama 3.2 1B), trained on data_v2 (see dataset_v2/).
# Deploy with: python3 build_lora_gguf.py adapters_1b && ollama create byte-llm:v2-lora -f ByteModelfile.lora
model: "mlx-community/Llama-3.2-1B-Instruct-4bit"
train: true
fine_tune_type: "lora"
data: "data_v2"          # built by dataset_v2/build_dataset_v2.py
adapter_path: "adapters_1b"
mask_prompt: true          # learn Byte's replies, not the prompts
num_layers: -1
batch_size: 4
grad_accumulation_steps: 1
grad_checkpoint: true
iters: 1200                # ~0.6 epoch over 7.9k examples
learning_rate: 1e-4
steps_per_report: 50
steps_per_eval: 400
val_batches: 25
save_every: 1200           # one save: keeps disk use to ~50 MB
max_seq_length: 1024
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 2.0
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
